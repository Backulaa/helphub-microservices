spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/helphub_identity}
    username: ${DB_USER:helphub}
    password: ${DB_PASSWORD}

  config:
    import: "optional:file:./.env[.properties]"

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        timezone:
          default_storage: NORMALIZE_UTC