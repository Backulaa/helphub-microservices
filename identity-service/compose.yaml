services:
  # ==========================================
  # PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:17-alpine
    container_name: helphub-identity-postgres

    environment:
      POSTGRES_DB: ${DB_NAME:-helphub_identity}
      POSTGRES_USER: ${DB_USER:-helphub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - identity_pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

  # ==========================================
  # Mailpit - Development SMTP Server
  # ==========================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: helphub-mailpit

    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

    restart: unless-stopped

  # ==========================================
  # IdentityService - Spring Boot
  # ==========================================
  identity-service:
    profiles: ["full"]

    build:
      context: .
      dockerfile: Dockerfile

    container_name: helphub-identity-service

    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8081"

      # Database connection
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-helphub_identity}
      DB_USER: ${DB_USER:-helphub}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

      # SMTP connection
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_FROM: ${MAIL_FROM:-no-reply@helphub.local}

      # JWT secret
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?JWT_SECRET_BASE64 is required}
      JWT_ISSUER: ${JWT_ISSUER:-helphub-identity}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-helphub-services}

      # OTP security
      OTP_HMAC_KEY_BASE64: ${OTP_HMAC_KEY_BASE64:?OTP_HMAC_KEY_BASE64 is required}

      # Cookie and CORS settings
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    
    ports:
      - "127.0.0.1:8081:8081"

    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

    restart: unless-stopped

volumes:
  identity_pgdata: