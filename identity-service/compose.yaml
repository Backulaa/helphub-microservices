services:
  postgres:
    image: postgres:17-alpine
    container_name: helphub-identity-postgres

    environment:
      POSTGRES_DB: helphub_identity
      POSTGRES_USER: helphub
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - identity_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL",
             "pg_isready -U helphub -d helphub_identity"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  identity-service:
    profiles: ["full"]

    build:
      context: .
      dockerfile: Dockerfile

    container_name: helphub-identity-service

    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8081

      DB_URL: jdbc:postgresql://postgres:5432/helphub_identity
      DB_USER: helphub
      DB_PASSWORD: ${DB_PASSWORD}

    ports:
      - "127.0.0.1:8081:8081"

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

volumes:
  identity_pgdata: