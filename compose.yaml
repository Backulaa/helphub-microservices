name: helphub

services:

  # ==========================================
  # SHARED POSTGRESQL INSTANCE
  # ==========================================
  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?required}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d postgres
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

    networks:
      - backend

    restart: unless-stopped

  # ==========================================
  # AUTOMATIC DATABASE BOOTSTRAP
  # ==========================================
  db-init:
    image: postgres:17-alpine

    environment:
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:?required}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?required}

      IDENTITY_DB_NAME: ${IDENTITY_DB_NAME:?required}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER:?required}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?required}

      SUPPORT_DB_NAME: ${SUPPORT_DB_NAME:?required}
      SUPPORT_DB_USER: ${SUPPORT_DB_USER:?required}
      SUPPORT_DB_PASSWORD: ${SUPPORT_DB_PASSWORD:?required}

      MEDIA_DB_NAME: ${MEDIA_DB_NAME:?required}
      MEDIA_DB_USER: ${MEDIA_DB_USER:?required}
      MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD:?required}

    volumes:
      - ./infrastructure/postgres/bootstrap.sh:/scripts/bootstrap.sh:ro

    entrypoint:
      - /bin/sh
      - /scripts/bootstrap.sh

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - backend

    restart: "no"

  # ==========================================
  # MAILPIT
  # ==========================================
  mailpit:
    image: axllent/mailpit:latest

    networks:
      - backend

    restart: unless-stopped

  # ==========================================
  # IDENTITY SERVICE
  # ==========================================
  identity-service:
    build:
      context: ./services/identity-service
      dockerfile: Dockerfile

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      SERVER_PORT: "8081"

      DB_URL: jdbc:postgresql://postgres:5432/${IDENTITY_DB_NAME}
      DB_USER: ${IDENTITY_DB_USER}
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD}

      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_FROM: ${MAIL_FROM:?required}

      OTP_HMAC_KEY_BASE64: ${OTP_HMAC_KEY_BASE64:?required}

      JWT_PRIVATE_KEY_PATH: /run/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /run/keys/public.pem
      JWT_KEY_ID: ${JWT_KEY_ID:?required}
      JWT_ISSUER: ${JWT_ISSUER:-helphub-identity}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-helphub-services}

      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost:5173}

    volumes:
      - ./infrastructure/keys:/run/keys:ro

    depends_on:
      db-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

    networks:
      - backend

    restart: unless-stopped

  # ==========================================
  # API GATEWAY
  # ==========================================
  api-gateway:
    build:
      context: ./gateway/api-gateway
      dockerfile: Dockerfile

    environment:
      SERVER_PORT: "8080"

      IDENTITY_SERVICE_URL: http://identity-service:8081
      JWT_JWKS_URI: http://identity-service:8081/internal/jwks
      JWT_ISSUER: ${JWT_ISSUER:-helphub-identity}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-helphub-services}

      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      identity-service:
        condition: service_started

    networks:
      - backend

    restart: unless-stopped

# ==========================================
# NETWORKS
# ==========================================
networks:
  backend:
    driver: bridge

# ==========================================
# VOLUMES
# ==========================================
volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-helphub_pgdata}
