
spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/admin/users/**

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/notifications,/api/v1/notifications/**

          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_UNIQUE

          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - ${FRONTEND_ORIGIN:http://localhost:5173}
                  - http://localhost:8081
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - X-XSRF-TOKEN
                  - X-Request-ID
                exposedHeaders:
                  - X-Request-ID
                allowCredentials: true
                maxAge: 3600

          httpclient:
            connect-timeout: 2000
            response-timeout: 10s

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    jwk-set-uri: ${JWT_JWKS_URI:http://localhost:8081/internal/jwks}
    issuer: ${JWT_ISSUER:helphub-identity}
    audience: ${JWT_AUDIENCE:helphub-services}

management:
  endpoints:
    web:
      exposure:
        include: health,info
