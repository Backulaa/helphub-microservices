spring:
  # ==========================================
  # Load root .env for local Maven execution
  # ==========================================
  config:
    import: "optional:file:../../.env[.properties]"

  # ==========================================
  # PostgreSQL
  # ==========================================
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/helphub_media}
    username: ${DB_USER:${MEDIA_DB_USER:helphub_media_app}}
    password: ${DB_PASSWORD:${MEDIA_DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  # ==========================================
  # JPA / Hibernate
  # ==========================================
  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        timezone:
          default_storage: NORMALIZE_UTC

# ==========================================
# Logging
# ==========================================
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.amqp: DEBUG
    org.hibernate.SQL: DEBUG
    com.helphub.media: DEBUG

app:
  swagger:
    enabled: true

  media:
    recovery:
      enabled: true
      stale-after-seconds: 60
      initial-delay-ms: 10000
      fixed-delay-ms: 30000
      batch-size: 10
      
    outbox:
      enabled: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  paths-to-match:
    - /api/v1/media
    - /api/v1/media/**
