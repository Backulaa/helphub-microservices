spring:
  application:
    name: media-service

  # ==========================================
  # RabbitMQ
  # ==========================================
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:helphub}

    # Publisher reliability
    publisher-confirm-type: correlated
    publisher-returns: true

    template:
      mandatory: true

  servlet:
      multipart:
        enabled: true
        max-file-size: 20MB
        max-request-size: 21MB
        file-size-threshold: 0B

# ==========================================
# Server
# ==========================================
server:
  port: ${SERVER_PORT:8082}

# ==========================================
# Actuator
# ==========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info

# ==========================================
# Application Settings
# ==========================================
app:
  # ==========================================
  # JWT Security
  # ==========================================
  security:
    jwt:
      issuer: ${JWT_ISSUER:helphub-identity}
      audience: ${JWT_AUDIENCE:helphub-services}
      jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/internal/jwks}

  # ==========================================
  # Cloudinary
  # ==========================================
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}

  # ==========================================
  # Media Settings
  # ==========================================
  media:
    upload:
      max-image-size: 10485760
      max-pdf-size: 20971520

      allowed-mime-types:
        - image/jpeg
        - image/png
        - image/webp
        - application/pdf

    cleanup:
      grace-period: PT24H

    recovery:
      enabled: false
      stale-after-seconds: 900
      initial-delay-ms: 30000
      fixed-delay-ms: 300000
      batch-size: 10

    internal:
      community-key: ${MEDIA_INTERNAL_COMMUNITY_KEY:}
      support-key: ${MEDIA_INTERNAL_SUPPORT_KEY:}

    access-grant:
      ttl-seconds: ${MEDIA_ACCESS_GRANT_TTL_SECONDS:120}

    outbox:
      enabled: false
      exchange: helphub.media.events.v1
      routing-key: media.ready.v1
      batch-size: 10
      initial-delay-ms: 15000
      fixed-delay-ms: 5000
      lease-seconds: 180
      confirm-timeout-seconds: 10
      retry-base-seconds: 10
      max-backoff-seconds: 300
      max-retries: 10

  swagger:
    enabled: false

# ==========================================
# Logging
# ==========================================
logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-none}]"

# ==========================================
# Swagger / OpenAPI
# ==========================================
springdoc:
  api-docs:
    enabled: false

  swagger-ui:
    enabled: false
