spring:
  # ==========================================
  # PostgreSQL
  # ==========================================
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # ==========================================
  # JPA / Hibernate
  # ==========================================
  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        timezone:
          default_storage: NORMALIZE_UTC

# ==========================================
# Logging
# ==========================================
logging:
  level:
    root: INFO
    org.springframework.amqp: WARN
    com.helphub.notification: INFO
